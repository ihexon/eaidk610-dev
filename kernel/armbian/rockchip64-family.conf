# EAIDK610 Type-C test-kernel identity override.
#
# Armbian sources this user file after its built-in rockchip64.conf.  Giving the
# test kernel its own LINUXFAMILY keeps the make LOCALVERSION, module directory,
# Debian package paths and package names in agreement.  The config and patch
# directory remain those of the fixed rockchip64 7.1 baseline.

declare -g LINUXFAMILY="rockchip64-eaidk610-typec-r1"
declare -g LINUXCONFIG="linux-rockchip64-edge"
declare -g KERNEL_PATCH_ARCHIVE_BASE="rockchip64"
declare -g KERNELPATCHDIR="archive/rockchip64-7.1"
