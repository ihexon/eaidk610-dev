SectionVerb {
	EnableSequence [
		# AIF1 playback; do not feed the microphone back into the DAC.
		cset "name='DAC MIXL INF1 Switch' on"
		cset "name='DAC MIXR INF1 Switch' on"
		cset "name='DAC MIXL Stereo ADC Switch' off"
		cset "name='DAC MIXR Stereo ADC Switch' off"
		cset "name='Stereo DAC MIXL DAC L1 Switch' on"
		cset "name='Stereo DAC MIXR DAC R1 Switch' on"
		cset "name='Stereo DAC MIXL DAC R1 Switch' off"
		cset "name='Stereo DAC MIXR DAC L1 Switch' off"
		cset "name='Stereo DAC MIXL DAC L2 Switch' off"
		cset "name='Stereo DAC MIXR DAC R2 Switch' off"
		cset "name='HPO MIX DAC1 Switch' on"
		cset "name='HPO MIX HPVOL Switch' off"
		cset "name='HPO L Playback Switch' off"
		cset "name='HPO R Playback Switch' off"
		cset "name='Internal Speaker Switch' off"

		# Analog capture, with no digital loopback or unused input mixed in.
		cset "name='ADC Capture Volume' 47,47"
		cset "name='ADC Boost Gain' 0,0"
		cset "name='Stereo1 ADC L1 Mux' ADC"
		cset "name='Stereo1 ADC R1 Mux' ADC"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' on"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' on"
		cset "name='Stereo1 ADC MIXL ADC2 Switch' off"
		cset "name='Stereo1 ADC MIXR ADC2 Switch' off"
		cset "name='RECMIXL INL1 Switch' off"
		cset "name='RECMIXR INR1 Switch' off"
		cset "name='RECMIXL BST1 Switch' off"
		cset "name='RECMIXR BST1 Switch' off"
		cset "name='RECMIXL BST2 Switch' off"
		cset "name='RECMIXR BST2 Switch' off"
		cset "name='RECMIXL BST3 Switch' off"
		cset "name='RECMIXR BST3 Switch' off"
		cset "name='ADC Capture Switch' on,on"
	]
	DisableSequence [
		cset "name='Internal Speaker Switch' off"
		cset "name='HPO L Playback Switch' off"
		cset "name='HPO R Playback Switch' off"
		cset "name='RECMIXL BST2 Switch' off"
		cset "name='RECMIXR BST2 Switch' off"
		cset "name='RECMIXL BST3 Switch' off"
		cset "name='RECMIXR BST3 Switch' off"
	]
	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "External speaker amplifier"
	ConflictingDevice [ "Headphones" ]
	EnableSequence [
		cset "name='HPO L Playback Switch' on"
		cset "name='HPO R Playback Switch' on"
		cset "name='Internal Speaker Switch' on"
	]
	DisableSequence [
		cset "name='Internal Speaker Switch' off"
		cset "name='HPO L Playback Switch' off"
		cset "name='HPO R Playback Switch' off"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "DAC1"
		PlaybackVolume "DAC1 Playback Volume"
	}
}

SectionDevice."Headphones" {
	Comment "3.5 mm headphones"
	ConflictingDevice [ "Speaker" ]
	EnableSequence [
		cset "name='Internal Speaker Switch' off"
		cset "name='HPO L Playback Switch' on"
		cset "name='HPO R Playback Switch' on"
	]
	DisableSequence [
		cset "name='HPO L Playback Switch' off"
		cset "name='HPO R Playback Switch' off"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "DAC1"
		PlaybackVolume "DAC1 Playback Volume"
		JackControl "Headphones Jack"
		# The amp is muted by the sequence above, not by hardware jack detection.
	}
}

SectionDevice."Mic" {
	Comment "Onboard microphone"
	ConflictingDevice [ "Headset" ]
	EnableSequence [
		cset "name='RECMIXL BST3 Switch' off"
		cset "name='RECMIXR BST3 Switch' off"
		cset "name='RECMIXL BST2 Switch' on"
		cset "name='RECMIXR BST2 Switch' on"
	]
	DisableSequence [
		cset "name='RECMIXL BST2 Switch' off"
		cset "name='RECMIXR BST2 Switch' off"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},0"
		CaptureMixerElem "ADC"
		CaptureVolume "ADC Capture Volume"
		CaptureSwitch "ADC Capture Switch"
	}
}

SectionDevice."Headset" {
	Comment "CTIA headset microphone"
	ConflictingDevice [ "Mic" ]
	EnableSequence [
		cset "name='RECMIXL BST2 Switch' off"
		cset "name='RECMIXR BST2 Switch' off"
		cset "name='RECMIXL BST3 Switch' on"
		cset "name='RECMIXR BST3 Switch' on"
	]
	DisableSequence [
		cset "name='RECMIXL BST3 Switch' off"
		cset "name='RECMIXR BST3 Switch' off"
	]
	Value {
		# Insertion does not distinguish headphones from a headset with a mic.
		# Keep the onboard microphone preferred; headset capture is selectable.
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureMixerElem "ADC"
		CaptureVolume "ADC Capture Volume"
		CaptureSwitch "ADC Capture Switch"
		JackControl "Headphones Jack"
	}
}
