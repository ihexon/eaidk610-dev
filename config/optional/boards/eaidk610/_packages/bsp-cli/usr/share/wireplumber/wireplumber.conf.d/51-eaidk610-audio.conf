# Prefer the board's analog output over the generic HDMI fallback.
# Explicit user-selected default devices still take precedence.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-rt5651-sound" } ]
    # Keep ADC digital gain at 0 dB instead of amplifying and compensating in software.
    actions = { update-props = { api.alsa.soft-mixer = true } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-rt5651-sound.*" } ]
    actions = { update-props = { priority.session = 1100 } }
  }
]
