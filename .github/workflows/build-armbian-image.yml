name: Build and release EAIDK610 Armbian image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: New GitHub pre-release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: eaidk610-armbian-image
  cancel-in-progress: false

jobs:
  build:
    name: ARM64 full image build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Check out Armbian with EAIDK610 support
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Reject an invalid or existing release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ ${RELEASE_TAG} =~ ^eaidk610-armbian-edge-[A-Za-z0-9._-]+$ ]]
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            printf 'Release tag already exists: %s\n' "${RELEASE_TAG}" >&2
            exit 2
          fi

      - name: Install validation tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            binutils device-tree-compiler fdisk jq shellcheck util-linux xz-utils

      - name: Lint build scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          shellcheck -S warning \
            tools/eaidk610/preflight-image-build.sh \
            tools/eaidk610/build-image.sh \
            tools/eaidk610/validate-image.sh
          shellcheck -S warning -s bash config/boards/eaidk610.csc

      - name: Build and validate complete image
        shell: bash
        run: tools/eaidk610/build-image.sh

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eaidk610-image-failure-${{ github.run_id }}
          path: |
            artifacts/build.log
            output/logs/
            output/info/
          if-no-files-found: warn
          retention-days: 1

      - name: Publish validated image as GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TAG}" \
            --notes-file artifacts/release/RELEASE-NOTES.md \
            --prerelease \
            artifacts/release/eaidk610-armbian-edge.img.xz \
            artifacts/release/linux-image-eaidk610-edge.deb \
            artifacts/release/linux-dtb-eaidk610-edge.deb \
            artifacts/release/linux-headers-eaidk610-edge.deb \
            artifacts/release/linux-libc-dev-eaidk610-edge.deb \
            artifacts/release/armbian-bsp-eaidk610-edge.deb \
            artifacts/release/SHA256SUMS \
            artifacts/release/BUILD-MANIFEST.txt
